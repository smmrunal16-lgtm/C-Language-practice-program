name: C Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Compile all C examples
        run: |
          set -e
          for file in *.c; do
            echo "Compiling $file"
            gcc -std=c11 -Wall -Wextra -Wpedantic -Werror "$file" -o "/tmp/${file%.c}"
          done
