name: C Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Compile every C source file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            output="/tmp/c-program-$count"
            echo "::group::Compiling $file"
            gcc -std=c11 -Wall -Wextra -Wpedantic "$file" -o "$output"
            echo "PASS: $file"
            echo "::endgroup::"
          done < <(find . -type f -name '*.c' -not -path './.git/*' -print0)
          if [ "$count" -eq 0 ]; then
            echo "No C source files found."
            exit 1
          fi
          echo "Successfully compiled $count C source files."
